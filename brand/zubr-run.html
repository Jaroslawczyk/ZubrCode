<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zubr Run</title>
<style>
  body{margin:0;background:#0F0E0B;color:#EDE9E3;font-family:Manrope,Inter,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:32px 16px}
  h1{font-size:22px;margin:0 0 6px}
  .hint{color:#A8A29A;font-size:14px;margin:0 0 16px}
  .game{position:relative;border:1px solid #2C2822;border-radius:14px;overflow:hidden;background:#0F0E0B}
  canvas{display:block;width:100%;height:260px;touch-action:manipulation;cursor:pointer}
  .cta{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(15,14,11,.72);text-align:center;padding:16px}
  .cta.show{display:flex}
  .cta p{margin:0;font-size:16px}
  .btn{background:#F2A93B;color:#1A1206;font-weight:700;padding:11px 18px;border-radius:10px;border:0;font-size:15px;cursor:pointer;text-decoration:none}
  .btn.ghost{background:transparent;color:#EDE9E3;border:1px solid #2C2822}
  .btn:focus-visible{outline:2px solid #5B8DEF;outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Зубр бежит по пуще</h1>
  <p class="hint">Пробел, ↑ или тап — прыжок. Кусты, пни, муравейники и брёвна.</p>
  <div class="game">
    <canvas id="c" role="img" aria-label="Мини-игра: пиксельный зубр бежит по лесу и перепрыгивает препятствия"></canvas>
    <div class="cta show" id="start">
      <p>Помогите зубру добежать до релиза</p>
      <button class="btn" id="play">Играть</button>
    </div>
    <div class="cta" id="over">
      <p id="overText">Зубр устал</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn ghost" id="again">Ещё раз</button>
        <a class="btn" href="#contact">Пока он отдыхает — обсудим проект?</a>
      </div>
    </div>
  </div>
</div>

y="15" width="4" height="1" fill="#5A3410"/><rect x="12" y="15" width="5" height="1" fill="#8A5418"/><rect x="17" y="15" width="1" height="1" fill="#5A3410"/><rect x="23" y="15" width="1" height="1" fill="#B8731F"/><rect x="24" y="15" width="2" height="1" fill="#8A5418"/><rect x="28" y="15" width="2" height="1" fill="#DB8F2B"/><rect x="30" y="15" width="1" height="1" fill="#B8731F"/><rect x="9" y="16" width="1" height="1" fill="#F2A93B"/><rect x="10" y="16" width="2" height="1" fill="#5A3410"/><rect x="12" y="16" width="4" height="1" fill="#8A5418"/><rect x="23" y="16" width="3" height="1" fill="#B8731F"/><rect x="28" y="16" width="1" height="1" fill="#F2A93B"/><rect x="29" y="16" width="1" height="1" fill="#DB8F2B"/><rect x="30" y="16" width="1" height="1" fill="#B8731F"/><rect x="9" y="17" width="2" height="1" fill="#DB8F2B"/><rect x="11" y="17" width="1" height="1" fill="#8A5418"/><rect x="13" y="17" width="1" height="1" fill="#B8731F"/><rect x="14" y="17" width="2" height="1" fill="#8A5418"/><rect x="24" y="17" width="2" height="1" fill="#B8731F"/><rect x="29" y="17" width="3" height="1" fill="#DB8F2B"/><rect x="10" y="18" width="1" height="1" fill="#DB8F2B"/><rect x="11" y="18" width="1" height="1" fill="#B8731F"/><rect x="14" y="18" width="1" height="1" fill="#DB8F2B"/><rect x="24" y="18" width="1" height="1" fill="#B8731F"/><rect x="30" y="18" width="2" height="1" fill="#DB8F2B"/><rect x="9" y="19" width="1" height="1" fill="#8A5418"/><rect x="10" y="19" width="1" height="1" fill="#DB8F2B"/><rect x="14" y="19" width="2" height="1" fill="#DB8F2B"/><rect x="23" y="19" width="1" height="1" fill="#DB8F2B"/><rect x="24" y="19" width="1" height="1" fill="#B8731F"/><rect x="30" y="19" width="2" height="1" fill="#DB8F2B"/><rect x="8" y="20" width="3" height="1" fill="#3E2A18"/><rect x="14" y="20" width="1" height="1" fill="#3E2A18"/><rect x="15" y="20" width="1" height="1" fill="#8A5418"/><rect x="21" y="20" width="2" height="1" fill="#3E2A18"/><rect x="23" y="20" width="1" height="1" fill="#5A3410"/><rect x="29" y="20" width="3" height="1" fill="#3E2A18"/><rect x="8" y="21" width="3" height="1" fill="#3E2A18"/><rect x="13" y="21" width="3" height="1" fill="#3E2A18"/><rect x="21" y="21" width="3" height="1" fill="#3E2A18"/><rect x="29" y="21" width="3" height="1" fill="#3E2A18"/></svg>`;
const zubr = new Image();
zubr.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ZUBR_SVG);

const OBST = {
  bush: {cell: 6, map: ['..gGg..', '.gGGGg.', 'gGGgGGg', 'GGgGGgG', '.GGGGG.'], pal: {g: '#6B8A3A', G: '#4A6328'}},
  stump: {cell: 6, map: ['rrrrr', 'tTTTt', 'tTtTt', 'tTTTt', 'tTTTt'], pal: {r: '#C09050', t: '#7A4A1A', T: '#9A5E1C'}},
  anthill: {cell: 6, map: ['...a...', '..aAa..', '.aAaAa.', 'aAaAaAa'], pal: {a: '#8A5418', A: '#B8731F'}},
  log: {cell: 6, map: ['LLLLLLLLc', 'LlLLlLLLc', 'LLLLLLLLc'], pal: {L: '#8A5418', l: '#5A3410', c: '#DB8F2B'}},
};
const KINDS = Object.keys(OBST);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, GROUND, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  GROUND = H - 34;
}
addEventListener('resize', resize); resize();

const ZW = 85, ZH = 55, ZX = 40, G = 2300, JUMP = -720;
let state = 'idle', y, vy, speed, obstacles, nextIn, score, best, t0, last, trees;
try { best = +localStorage.getItem('zubr-best') || 0; } catch (e) { best = 0; }

function reset() {
  y = GROUND - ZH; vy = 0; speed = 320; obstacles = []; nextIn = 0.8; score = 0; t0 = 0;
  trees = Array.from({length: 14}, (_, i) => ({x: i * 90 + Math.random() * 40, s: 0.6 + Math.random() * 0.6}));
}
function jump() {
  if (state === 'idle' || state === 'over') return start();
  if (y >= GROUND - ZH - 0.5) vy = JUMP;
}
function start() {
  reset(); state = 'run'; last = performance.now();
  document.getElementById('start').classList.remove('show');
  document.getElementById('over').classList.remove('show');
  cv.focus(); requestAnimationFrame(loop);
}
function gameOver() {
  state = 'over';
  const s = Math.floor(score);
  if (s > best) { best = s; try { localStorage.setItem('zubr-best', best); } catch (e) {} }
  document.getElementById('overText').textContent = `Зубр устал. Счёт: ${s} · рекорд: ${best}`;
  document.getElementById('over').classList.add('show');
  document.getElementById('again').focus();
}

function drawPixels(o, x, yBottom) {
  const def = OBST[o.kind], c = def.cell, h = def.map.length * c;
  def.map.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch !== '.') { ctx.fillStyle = def.pal[ch]; ctx.fillRect(x + i * c, yBottom - h + j * c, c, c); }
  }));
}
function drawTree(x, s) {
  const c = 6, rows = Math.round(9 * s);
  ctx.fillStyle = '#1C1A15';
  for (let j = 0; j < rows; j++) {
    const w = Math.max(1, Math.floor((j + 2) / 2)) * c;
    ctx.fillRect(x - w / 2, GROUND - (rows - j) * c - 12, w, c);
  }
  ctx.fillRect(x - c / 2, GROUND - 12, c, 12);
}

function loop(now) {
  if (state !== 'run') return;
  const dt = Math.min(0.033, (now - last) / 1000); last = now; t0 += dt;
  speed += 9 * dt; score += dt * speed / 40;

  vy += G * dt; y += vy * dt;
  if (y > GROUND - ZH) { y = GROUND - ZH; vy = 0; }

  nextIn -= dt;
  if (nextIn <= 0) {
    const kind = KINDS[Math.floor(Math.random() * KINDS.length)], d = OBST[kind];
    obstacles.push({kind, x: W + 20, w: d.map[0].length * d.cell, h: d.map.length * d.cell});
    nextIn = (0.9 + Math.random() * 1.0) * 320 / speed + 0.35;
  }
  obstacles.forEach(o => o.x -= speed * dt);
  obstacles = obstacles.filter(o => o.x + o.w > -10);
  trees.forEach(t => { t.x -= speed * 0.25 * dt; if (t.x < -40) t.x += 14 * 90; });

  // collision (hitbox smaller than sprite)
  const zx1 = ZX + 14, zx2 = ZX + ZW - 10, zy2 = y + ZH - 4;
  for (const o of obstacles) {
    if (zx2 > o.x + 4 && zx1 < o.x + o.w - 4 && zy2 > GROUND - o.h + 4) return draw(now), gameOver();
  }
  draw(now);
  requestAnimationFrame(loop);
}

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  trees.forEach(t => drawTree(t.x, t.s));
  ctx.fillStyle = '#2C2822'; ctx.fillRect(0, GROUND, W, 3);
  ctx.fillStyle = '#3A352D';
  for (let x = -((t0 * speed) % 24); x < W; x += 24) ctx.fillRect(x, GROUND + 10, 6, 3);
  obstacles.forEach(o => drawPixels(o, o.x, GROUND));
  const bob = (state === 'run' && y >= GROUND - ZH - 0.5) ? (Math.floor(now / 90) % 2) * 2 : 0;
  if (zubr.complete) ctx.drawImage(zubr, ZX, y - bob, ZW, ZH);
  ctx.fillStyle = '#F2A93B'; ctx.font = '700 16px "JetBrains Mono", Consolas, monospace'; ctx.textAlign = 'right';
  ctx.fillText(String(Math.floor(score)).padStart(5, '0'), W - 16, 28);
  ctx.fillStyle = '#A8A29A'; ctx.font = '12px "JetBrains Mono", Consolas, monospace';
  ctx.fillText('HI ' + String(best).padStart(5, '0'), W - 16, 46);
}

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (document.activeElement && document.activeElement.tagName === 'A') return;
    e.preventDefault(); jump();
  }
});
cv.addEventListener('pointerdown', jump);
document.getElementById('play').onclick = start;
document.getElementById('again').onclick = start;
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') gameOver(); });

reset(); zubr.onload = () => draw(performance.now()); draw(0);
</script>
</body>
